name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress. A push to main gets
# a group of its own, keyed by its commit, so every commit that lands on main gets a finished
# result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs, with the release tag in a trailing comment.
# Dependabot (.github/dependabot.yml) opens pull requests that move both together.
jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is the exact version in rust-toolchain.toml, with its components; the
      # compile-fail tests' expected output is tied to it.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The release artifact itself (decisions 0009, 0011, 0013 and 0014, design section 12). A
  # `test-support` build is exempt from the receipt-store gate, may disable identity or audit,
  # and may reach a server on loopback, and a feature can be turned on in any build, so this
  # builds `switchboard` with exactly deploy/Dockerfile's command and checks that it refuses each
  # opt-out and a server on loopback, which shows it is not a development build, and a proxied
  # `propose` tool as its registry loads. The receipt-store gate
  # cannot be reached from a registry until built-in connectors exist (milestone 4): the loader
  # refuses every proxied tool not classified `read` first. crates/demo-checks/tests/release.rs
  # holds the commands, the configurations and the refusals to each other.
  release:
    name: Release build refuses unreceipted tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The audit database each configuration below names. Nothing listens on port 9 (discard),
      # and every refusal comes before the gateway connects. A dummy, not a credential.
      SWITCHBOARD_CI_DATABASE_URL: postgres://switchboard_gateway:not-a-password@127.0.0.1:9/switchboard?connect_timeout=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build switchboard as deploy/Dockerfile does
        run: cargo build --release --locked -p gateway --bin switchboard
      # deploy/ci/proxied-propose/ serves one proxied `propose` tool, with identity enforced
      # against a checked-in public key and audit naming a database that is never reached. The
      # binary must exit 1 and name the loader's rule 2, not any other refusal: it applies the
      # snapshot loader's rules as the registry loads, before it reads a credential or connects.
      # If it started instead, the timeout stops it with status 124.
      - name: The release switchboard refuses a proxied propose tool as its registry loads
        run: |
          set +e
          SWITCHBOARD_INSTANCE=ci timeout 60 target/release/switchboard \
            --config=deploy/ci/proxied-propose/gateway.toml 2> proxied-propose-stderr.txt
          status=$?
          set -e
          cat proxied-propose-stderr.txt
          if [ "$status" -ne 1 ]; then
            echo "expected switchboard to refuse to start with exit status 1, got $status"
            exit 1
          fi
          if ! grep -qF 'refused to start: rule 2: tool `docs__propose_document` is proxied through entry `mock-docs` and classified `propose`' proxied-propose-stderr.txt; then
            echo "switchboard refused to start, but not for the loader's rule 2"
            exit 1
          fi
      # deploy/ci/identity-disabled/ disables identity, which only a development build accepts
      # (decision 0014). The binary must exit 1 and name that opt-out.
      - name: The release switchboard refuses identity disabled
        run: |
          set +e
          SWITCHBOARD_INSTANCE=ci timeout 60 target/release/switchboard \
            --config=deploy/ci/identity-disabled/gateway.toml 2> identity-disabled-stderr.txt
          status=$?
          set -e
          cat identity-disabled-stderr.txt
          if [ "$status" -ne 1 ]; then
            echo "expected switchboard to refuse to start with exit status 1, got $status"
            exit 1
          fi
          if ! grep -qF 'refused to start: identity is disabled, which only a development build allows' identity-disabled-stderr.txt; then
            echo "switchboard refused to start, but not for the identity opt-out"
            exit 1
          fi
      # deploy/ci/audit-disabled/ disables audit, which only a development build accepts
      # (decision 0014). The binary must exit 1 and name that opt-out.
      - name: The release switchboard refuses audit disabled
        run: |
          set +e
          SWITCHBOARD_INSTANCE=ci timeout 60 target/release/switchboard \
            --config=deploy/ci/audit-disabled/gateway.toml 2> audit-disabled-stderr.txt
          status=$?
          set -e
          cat audit-disabled-stderr.txt
          if [ "$status" -ne 1 ]; then
            echo "expected switchboard to refuse to start with exit status 1, got $status"
            exit 1
          fi
          if ! grep -qF 'refused to start: audit is disabled, which only a development build allows' audit-disabled-stderr.txt; then
            echo "switchboard refused to start, but not for the audit opt-out"
            exit 1
          fi
      # deploy/ci/loopback-destination/ registers a server at 127.0.0.1, which only a development
      # build may reach (decision 0013, section 3). The binary must exit 1 and name that address.
      - name: The release switchboard refuses a server on loopback
        run: |
          set +e
          SWITCHBOARD_INSTANCE=ci timeout 60 target/release/switchboard \
            --config=deploy/ci/loopback-destination/gateway.toml 2> loopback-destination-stderr.txt
          status=$?
          set -e
          cat loopback-destination-stderr.txt
          if [ "$status" -ne 1 ]; then
            echo "expected switchboard to refuse to start with exit status 1, got $status"
            exit 1
          fi
          if ! grep -qF 'refused to start: server `mock-docs`: the gateway does not connect to 127.0.0.1, a loopback address' loopback-destination-stderr.txt; then
            echo "switchboard refused to start, but not for the server on loopback"
            exit 1
          fi

  # The audit store's tests that need a database run only when SWITCHBOARD_TEST_DATABASE_URL is
  # set, and the job above does not set it. This one does, against a throwaway Postgres that
  # lives only for the job. Each test makes its own database and roles and drops them.
  postgres:
    name: Audit store against Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Pinned by the digest of the multi-arch index for this tag. Dependabot does not update
        # images in workflow files, so bump the tag and the digest together by hand; the digest
        # comes from `docker buildx imagetools inspect postgres:<tag>`.
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          # A dummy password for this throwaway service container only. Not a credential.
          POSTGRES_PASSWORD: dummy-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SWITCHBOARD_TEST_DATABASE_URL: postgres://postgres:dummy-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A test with no server says "skipped" and passes. Here that would mean the job checked
      # nothing, so the job fails if any test says it. --nocapture also puts the latency test's
      # p50 and p95 in the log; they measure a CI runner, not production.
      - name: Test the audit store against Postgres
        run: |
          set -o pipefail
          cargo test -p audit-postgres --locked -- --nocapture 2>&1 | tee test-output.txt
          if grep -q 'skipped: SWITCHBOARD_TEST_DATABASE_URL is not set' test-output.txt; then
            echo "a Postgres test was skipped, so SWITCHBOARD_TEST_DATABASE_URL did not reach it"
            exit 1
          fi
      # The gateway built from files, writing its rows as its own role.
      - name: Test the gateway's audit wiring against Postgres
        run: |
          set -o pipefail
          cargo test -p gateway --test postgres --locked -- --nocapture 2>&1 | tee gateway-output.txt
          if grep -q 'skipped: SWITCHBOARD_TEST_DATABASE_URL is not set' gateway-output.txt; then
            echo "the gateway's Postgres test was skipped, so SWITCHBOARD_TEST_DATABASE_URL did not reach it"
            exit 1
          fi
      # The demo's database as Compose and kind set it up: deploy/demo/roles.sql and migrate.sh's
      # grants, then the audit store's boot check as the gateway's role.
      - name: Test the demo's database setup against Postgres
        run: |
          set -o pipefail
          cargo test -p demo-checks --test database --locked -- --nocapture 2>&1 | tee demo-db-output.txt
          if grep -q 'skipped: SWITCHBOARD_TEST_DATABASE_URL is not set' demo-db-output.txt; then
            echo "the demo database test was skipped, so SWITCHBOARD_TEST_DATABASE_URL did not reach it"
            exit 1
          fi
