name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress. A push to main gets
# a group of its own, keyed by its commit, so every commit that lands on main gets a finished
# result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs, with the release tag in a trailing comment.
# Dependabot (.github/dependabot.yml) opens pull requests that move both together.
jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is the exact version in rust-toolchain.toml, with its components; the
      # compile-fail tests' expected output is tied to it.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The release artifact itself (decision 0009, design section 12). A `test-support` build is
  # exempt from the receipt-store gate, and a feature can be turned on in any build, so this
  # builds `switchboard` with exactly deploy/Dockerfile's command and checks that it refuses a
  # `propose` tool with no receipt store. crates/demo-checks/tests/release.rs holds the two
  # commands to each other.
  release:
    name: Release build refuses unreceipted tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build switchboard as deploy/Dockerfile does
        run: cargo build --release --locked -p gateway --bin switchboard
      # deploy/ci/receipt-gate/ serves one `propose` tool, with identity and audit disabled so no
      # issuer or database is needed. The binary must exit 1 and name the receipt-store gate,
      # not any other refusal. If it started instead, the timeout stops it with status 124.
      - name: The release switchboard refuses a propose tool with no receipt store
        run: |
          set +e
          SWITCHBOARD_INSTANCE=ci timeout 60 target/release/switchboard \
            --config=deploy/ci/receipt-gate/gateway.toml 2> receipt-gate-stderr.txt
          status=$?
          set -e
          cat receipt-gate-stderr.txt
          if [ "$status" -ne 1 ]; then
            echo "expected switchboard to refuse to start with exit status 1, got $status"
            exit 1
          fi
          if ! grep -qF 'refused to start: tool `docs__propose_document` is classified `propose` and served on a surface, but no receipt store is configured' receipt-gate-stderr.txt; then
            echo "switchboard refused to start, but not for the receipt-store gate"
            exit 1
          fi

  # The audit store's tests that need a database run only when SWITCHBOARD_TEST_DATABASE_URL is
  # set, and the job above does not set it. This one does, against a throwaway Postgres that
  # lives only for the job. Each test makes its own database and roles and drops them.
  postgres:
    name: Audit store against Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Pinned by the digest of the multi-arch index for this tag. Dependabot does not update
        # images in workflow files, so bump the tag and the digest together by hand; the digest
        # comes from `docker buildx imagetools inspect postgres:<tag>`.
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          # A dummy password for this throwaway service container only. Not a credential.
          POSTGRES_PASSWORD: dummy-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SWITCHBOARD_TEST_DATABASE_URL: postgres://postgres:dummy-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A test with no server says "skipped" and passes. Here that would mean the job checked
      # nothing, so the job fails if any test says it. --nocapture also puts the latency test's
      # p50 and p95 in the log; they measure a CI runner, not production.
      - name: Test the audit store against Postgres
        run: |
          set -o pipefail
          cargo test -p audit-postgres --locked -- --nocapture 2>&1 | tee test-output.txt
          if grep -q 'skipped: SWITCHBOARD_TEST_DATABASE_URL is not set' test-output.txt; then
            echo "a Postgres test was skipped, so SWITCHBOARD_TEST_DATABASE_URL did not reach it"
            exit 1
          fi
      # The gateway built from files, writing its rows as its own role.
      - name: Test the gateway's audit wiring against Postgres
        run: |
          set -o pipefail
          cargo test -p gateway --test postgres --locked -- --nocapture 2>&1 | tee gateway-output.txt
          if grep -q 'skipped: SWITCHBOARD_TEST_DATABASE_URL is not set' gateway-output.txt; then
            echo "the gateway's Postgres test was skipped, so SWITCHBOARD_TEST_DATABASE_URL did not reach it"
            exit 1
          fi
      # The demo's database as Compose and kind set it up: deploy/demo/roles.sql and migrate.sh's
      # grants, then the audit store's boot check as the gateway's role.
      - name: Test the demo's database setup against Postgres
        run: |
          set -o pipefail
          cargo test -p demo-checks --test database --locked -- --nocapture 2>&1 | tee demo-db-output.txt
          if grep -q 'skipped: SWITCHBOARD_TEST_DATABASE_URL is not set' demo-db-output.txt; then
            echo "the demo database test was skipped, so SWITCHBOARD_TEST_DATABASE_URL did not reach it"
            exit 1
          fi
