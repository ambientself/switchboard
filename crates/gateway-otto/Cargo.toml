[package]
name = "gateway-otto"
version = "0.1.0"
description = "The Otto adapter: Otto's turn-grant format, its strict Ed25519 verifier, the grant-key configuration, the tool-name mapping and the client for Otto's resolver interface. The core does not depend on it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# What is specific to Otto is confined to this crate (design section 1). It depends on the core
# for the names a verified grant carries; nothing in the core depends on it.
[dependencies]
gateway-core = { path = "../gateway-core" }
base64 = "0.22"
# Already in the build through `jsonwebtoken`. Verification is `verify_strict`.
ed25519-dalek = "2"
# The resolver client's HTTP: HTTP/1.1 only, as issuer-keys and connector-proxy have it.
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
# The TLS connector for an https resolver, with no roots of its own and nothing read from the
# platform. Its provider is ring, which this crate passes to the client itself.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# Each resolver question's request ID, and the test minter's keys, from the operating system's
# randomness, so no key is checked in. As the testkit has it.
rand_core = { version = "0.6", features = ["getrandom"] }
# The TLS client, with ring as its only provider, never installed as the process default. Only
# the CA file the deployment names for the resolver is trusted.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The key ID and the grant's digest.
sha2 = "0.10"
thiserror = "2"
# The resolver's budget. The fake resolver adds a listener.
tokio = { version = "1", features = ["time"] }
# Only for the fake resolver's TLS listener.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

# `test-support` adds the test minter, which signs grants with keys it generates, and the fake
# resolver, a local HTTP server. The gateway's own build never turns it on.
[features]
test-support = ["dep:tokio-rustls", "tokio/io-util", "tokio/net", "tokio/rt"]

[dev-dependencies]
gateway-otto = { path = ".", features = ["test-support"] }
proptest = "1"
# A CA and its leaf certificates, made when a test runs: no key is checked in.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
