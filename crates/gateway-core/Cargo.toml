[package]
name = "gateway-core"
version = "0.1.0"
description = "The gateway's policy core: principals, classification, the decision function, denial sentences and the audit record. No I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The core performs no I/O. Keep HTTP, MCP, database and async-runtime crates out of this
# list; they belong in the crates that wrap the core.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The argument digest of a receipt (decision 0009). Hashing only: no I/O.
sha2 = { version = "0.10", default-features = false }
thiserror = "2"

[dev-dependencies]
proptest = "1"
trybuild = "1"

[lints]
workspace = true
