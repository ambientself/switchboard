[package]
name = "issuer-keys"
version = "0.1.0"
description = "Fetches one issuer's JWK set from the issuer's own origin, under a deadline and a cap on the body's size, following no redirect."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The gateway uses this crate to fetch keys; the identity crate never does, and stays offline.
# Keep this list to the allowlist in tests/dependencies.rs.
[dependencies]
gateway-core = { path = "../gateway-core" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
# The TLS connector for an https keys URL: HTTP/1.1 only, with no roots of its own and nothing
# read from the platform. Its provider is ring, which this crate passes to each client itself.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# The set is the identity crate's own type, so `Identity::replace_keys` takes what this crate
# returns. The same features as there: exactly one crypto backend, the pure-Rust one, because
# `jsonwebtoken` panics on first use if both are enabled anywhere in the build.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The TLS client, with ring as its only provider, never installed as the process default. Only
# the CA bundle the deployment names is trusted; `rustls::pki_types` reads its PEM.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
# Already in the build. Parses the issuer and the keys URL the way a browser would, so their
# origins are compared host to host and port to port, not as text.
url = "2"

[dev-dependencies]
# A CA and its leaf certificates, made when a test runs: no key is checked in.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Holds a loopback port with a socket bound to it without SO_REUSEADDR and connected to a peer
# of its own, so nothing listens there and connections to it are refused (tests/fetch.rs,
# closed_port). On Linux no other socket can bind the port while it is held; on macOS a socket
# that sets SO_REUSEADDR can still bind it by number.
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }
# The loopback HTTPS server the tests fetch from.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
