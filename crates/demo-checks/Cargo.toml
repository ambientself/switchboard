[package]
name = "demo-checks"
version = "0.1.0"
description = "Tests for the demo's deployment in deploy/: the scripted workload, the driver script, the Compose file and the kind manifests."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Tests only. The scripts under test need sh, bash, curl, jq, awk and tar on the machine.
[dev-dependencies]
# The audit store's budgets and the proxy's call deadline, which the gateway's grace period
# must outlast.
audit-postgres = { path = "../audit-postgres" }
connector-proxy = { path = "../connector-proxy" }
# The gateway's readiness removal, which the probe and the grace period are held to.
gateway = { path = "../gateway" }
gateway-core = { path = "../gateway-core" }
# Loads the registry variants the driver makes at run time, as the gateway loads them.
gateway-registry = { path = "../gateway-registry" }
# The names of the mock server's settings, which the kind manifest must use.
mock-docs-server = { path = "../mock-docs-server" }
serde_json = "1"
sha2 = "0.10"
# Holds a loopback port with a socket bound to it without SO_REUSEADDR and connected to a peer
# of its own, so nothing listens there and connections to it are refused (tests/common,
# closed_port). On Linux no other socket can bind the port while it is held; on macOS a socket
# that sets SO_REUSEADDR can still bind it by number.
socket2 = "0.6"
# Sets up the demo's database from its scripts on a throwaway server, when one is given.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
# Reads the demo's deployment files for the longest call deadline they set.
toml = "1"
# Parses the kind manifests for the token guards (tests/manifests.rs), so aliases, anchors, tags,
# quoting, escapes, blank lines and comments are read as the API server reads them. A tag or a
# merge key the parser would read otherwise is refused.
yaml-rust2 = { version = "0.13", default-features = false }

[lints]
workspace = true
