[package]
name = "gateway-dev"
version = "0.1.0"
description = "The gateway on the testkit's fakes, for development and tests: the fixture wiring, an audit store that prints its rows, the switchboard-dev binary and a scripted client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Development only. This crate depends on the testkit, which nothing in a running gateway may,
# so the switchboard-dev binary lives here and not in the gateway crate.
[dependencies]
gateway = { path = "../gateway" }
gateway-core = { path = "../gateway-core" }
gateway-identity = { path = "../gateway-identity" }
gateway-mcp = { path = "../gateway-mcp" }
gateway-testkit = { path = "../gateway-testkit" }
# The scripted client: plain HTTP/1.1 to loopback, with no TLS, no HTTP/2 and no proxy.
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync"] }

[dev-dependencies]
# Reads a token's claims back.
base64 = "0.22"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
