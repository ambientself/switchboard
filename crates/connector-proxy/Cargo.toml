[package]
name = "connector-proxy"
version = "0.1.0"
description = "The connector for a proxied MCP server: forwards an allowed tools/call upstream with the gateway's own credential, under a deadline and a cap on the answer's size."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Part of a running gateway, so it never depends on the test fakes or the identity crate: the
# caller's identity reaches it already proved, inside the core's ToolCall. Keep this list to
# the allowlist in tests/dependencies.rs.
[dependencies]
gateway-core = { path = "../gateway-core" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
# The TLS connector for an https server: HTTP/1.1 only, with no roots of its own and nothing
# read from the platform, as issuer-keys has it. Its provider is ring, which this crate passes
# to each client itself.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# The TLS client, with ring as its only provider, never installed as the process default. Only
# the CA file the deployment names for the server is trusted.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
# The resolver that checks each address is a Service, as hyper-util's own resolvers are.
# Already in the build through hyper-util.
tower-service = "0.3"
# Why a call was refused for its credential or its destination reaches the gateway's log, not
# the caller.
tracing = "0.1"

# `test-support` makes a development build: it alone lets a connector reach a loopback address,
# for the tests' local servers (decision 0013, section 3). The gateway's own `test-support`
# turns it on; the release build never does.
[features]
test-support = []

[dev-dependencies]
gateway-testkit = { path = "../gateway-testkit" }
mock-docs-server = { path = "../mock-docs-server" }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3"
# The tests are a development build, so they reach their local servers on loopback.
connector-proxy = { path = ".", features = ["test-support"] }
# A CA and its leaf certificates, made when a test runs: no key is checked in.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The loopback HTTPS servers the tests connect to.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
