[package]
name = "gateway-registry"
version = "0.1.0"
description = "The registry file: servers, approved tool definitions, surfaces, profiles, limits and profile selection, loaded into a policy snapshot, the definitions tools/list answers from, and each tool's argument-to-resource adapter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Reads one file and builds data. No HTTP, MCP, database or async-runtime crate: the gateway
# wraps this crate, not the other way round.
[dependencies]
gateway-core = { path = "../gateway-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"

[dev-dependencies]
gateway-testkit = { path = "../gateway-testkit" }

[lints]
workspace = true
