# CI's check of the release artifact: `switchboard --config=deploy/ci/proxied-propose/gateway.toml`
# must exit 1, refusing the registry's proxied `propose` tool as the registry loads (decision
# 0011, section 3, rule 2). Identity and audit are both on, as the release build requires
# (decision 0014): identity is enforced against a checked-in public key, and audit names a
# database CI never reaches. The registry is loaded before any connection, so the refusal comes
# first. The format is in crates/gateway/src/deployment.rs. Every value here is a dummy.

deployment = "ci-proxied-propose"
listen = "127.0.0.1:0"

[http]
allowed_hosts = ["localhost"]
allowed_origins = []

[registry]
file = "registry/registry.toml"
poll_seconds = 2

[identity]
mode = "enforce"

# A key set holding one public key only. Nobody holds its private key: it was generated, its
# public half written here, and the rest thrown away. No token can be signed for it.
[[identity.issuers]]
issuer = "https://ci-issuer.switchboard.test"
kind = "workload"
audiences = ["switchboard"]
algorithm = "ES256"
keys_file = "jwks.json"
subjects_file = "teams.toml"
max_lifetime_seconds = 3600
leeway_seconds = 30

[audit]
mode = "postgres"
# CI sets this to a database URL on a port nothing listens on. It is never connected to.
url_env = "SWITCHBOARD_CI_DATABASE_URL"

[credentials]
docs-credential = "dummy-credential"
