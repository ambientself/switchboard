# CI's check of the release artifact: `switchboard --config=deploy/ci/identity-disabled/gateway.toml`
# must exit 1, refusing `[identity] mode = "disabled"`, which only a development build accepts
# (decision 0014, section 4). Everything else would start: audit names a database, which the
# refusal comes before, and the registry serves nothing. The format is in
# crates/gateway/src/deployment.rs. Every value here is a dummy.

deployment = "ci-identity-disabled"
listen = "127.0.0.1:0"

[http]
allowed_hosts = ["localhost"]
allowed_origins = []

[registry]
file = "registry/registry.toml"
poll_seconds = 2

[identity]
mode = "disabled"

[audit]
mode = "postgres"
# CI sets this to a database URL on a port nothing listens on. It is never connected to.
url_env = "SWITCHBOARD_CI_DATABASE_URL"

[credentials]
