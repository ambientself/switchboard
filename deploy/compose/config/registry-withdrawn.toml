# The demo registry after `docs__read_document` is withdrawn: demo.sh copies this file over
# registry/registry.toml to show the withdrawal, and copies the original back afterwards.
# It is outside the registry directory, so the gateway never loads it directly.
#
# TODO(integration): the shape follows planDemo.md #14b (registry loader) and #14d (resource
# adapter). The loader decides the real field names; change this file to match, and the
# withdrawn copy next to the registry directory and the kind copy with it.

revision = "demo-2"

[[servers]]
name = "docs"
owner = "platform-demo"
address = "http://mock-docs:8080/mcp"
credential_mode = "gateway"
# A Compose secret holding a dummy value. The proxy sends it upstream; the workload never sees it.
credential_file = "/run/secrets/docs-credential"

[[tools]]
name = "docs__list_documents"
server = "docs"
upstream_name = "list_documents"
classification = "read"
resources = "declared"
description = "List the documents in one project."
approved_by = "demo-owner"
approved_at = "2026-10-06"
# TODO(integration): the sha256 of the approved definition, as the loader computes it.
definition_sha256 = "TODO"
resource_adapter = { from_argument = "project", system = "docs", kind = "project" }
[tools.input_schema]
type = "object"
required = ["project"]
additionalProperties = false
[tools.input_schema.properties.project]
type = "string"

[[surfaces]]
name = "docs"
tools = ["docs__list_documents"]
teams = ["team-a", "team-b"]
principals = "any_in_teams_and_groups"

[[profiles]]
name = "workload-read"
classifications = ["read"]
requires_delegation = false

[limits.teams]
team-a = [{ system = "docs", kind = "project", identifier = "atlas" }]
team-b = [{ system = "docs", kind = "project", identifier = "borealis" }]

[[selection]]
issuer = "https://dev-issuer.switchboard.test"
team = "team-a"
profile = "workload-read"

[[selection]]
issuer = "https://dev-issuer.switchboard.test"
team = "team-b"
profile = "workload-read"
