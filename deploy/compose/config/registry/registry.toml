# The demo registry for Compose (planDemo 14b): the mock server registered once per team, two
# read tools on each entry, and one surface per team. The loader is gateway-registry;
# crates/gateway-registry/demo/registry.toml documents the format. The issuer is the Compose dev
# issuer and the address is the mock server's Compose service.
#
# Keep it in step with deploy/kind/base/config/registry/registry.toml, which differs only in the
# issuer under [[profile_rules]], the identity and address under [[servers]], and so each
# tool's binding_sha256, and with ../registry-withdrawn.toml; crates/demo-checks checks both.
# Every value here is a dummy.

# Recorded with every decision made from this file. Change it with every edit.
revision = "demo-3"

# --- Servers -------------------------------------------------------------------------------
# A proxied MCP server, registered by its owner. `system` is the first part of every exposed
# name of its tools: docs-team-a__list_documents, docs-team-a__read_document. `identity` is the
# DNS name the connection proves, and must be the host in `address`.
#
# The mock server is registered once per team (decisions 0010 and 0013, section 10). Both
# entries have the same address and identity. Each presents its own credential, and the mock
# server limits each credential to its team's project: docs-team-a's to atlas, docs-team-b's to
# borealis. So a call through one team's entry cannot reach the other team's project, even if
# the gateway's own resource check were wrong.
#
# Each server is a connector entry (decision 0011, section 1). `credential` is its one
# credential: its mode, the label of its secret, and the identity it acts as, the same in kind
# and Compose. `narrowing` is what the credential is narrowed to per call ("call", "limit" or
# "none"); `permits`, the highest classification a call with it could have; `reach`, every
# resource it can reach, which is exactly the project mock-docs lets that identity read.
# `reach_test` records the test that showed a call outside the reach fails, and `reach_check`
# the call outside it that the scheduled reach check makes. `destination` is "in_cluster",
# which alone may use http. The loader refuses a snapshot that breaks one of decision 0011's
# nine rules: here, with narrowing "none", every team its surface admits must hold the whole
# reach in its limit.

[[servers]]
name = "docs-team-a"
system = "docs-team-a"
owner = "platform"
identity = "mock-docs"
address = "http://mock-docs:8080/mcp"
credential = { mode = "team_service_identity", reference = "docs-team-a-credential", principal = "docs-team-a" }
narrowing = "none"
permits = "read"
reach = [{ system = "docs", kind = "project", identifier = "atlas" }]
destination = "in_cluster"

[servers.reach_test]
date = 2026-10-12
record = "mock-docs-server tests a_static_token_reaches_only_its_own_project and each_subject_reaches_only_its_own_project: a caller limited to atlas is refused borealis with 403"

[servers.reach_check]
tool = "docs-team-a__list_documents"
arguments = { project = "borealis" }

[[servers]]
name = "docs-team-b"
system = "docs-team-b"
owner = "platform"
identity = "mock-docs"
address = "http://mock-docs:8080/mcp"
credential = { mode = "team_service_identity", reference = "docs-team-b-credential", principal = "docs-team-b" }
narrowing = "none"
permits = "read"
reach = [{ system = "docs", kind = "project", identifier = "borealis" }]
destination = "in_cluster"

[servers.reach_test]
date = 2026-10-12
record = "mock-docs-server tests a_static_token_reaches_only_its_own_project and each_subject_reaches_only_its_own_project: a caller limited to borealis is refused atlas with 403"

[servers.reach_check]
tool = "docs-team-b__list_documents"
arguments = { project = "atlas" }

# --- Tools ---------------------------------------------------------------------------------
# Each tool is approved by a person, who assigns its classification and records two hashes.
# `definition_sha256` covers the tool's upstream name, title, description and input schema,
# written here exactly as the server serves them: the mock server's `tools/list`, which has no
# title (see `gateway_registry::definition_sha256`). `binding_sha256` covers its server's
# identity, address, destination, credential and connector entry, and the schema dialect, but
# not the reach test's record or the reach check (see `gateway_registry::binding_sha256`). The
# loader recomputes both and refuses a file in which either differs from what was approved, so
# a changed server entry needs its tools approved again.
#
# `resources` is either "no_resources" or { from_arguments = [...] }: each entry names a string
# argument whose value is the identifier of a resource of that system and kind. There is no
# default: a tool must say which.

[[tools]]
name = "docs-team-a__list_documents"
server = "docs-team-a"
upstream_name = "list_documents"
classification = "read"
description = "List the names of the documents in one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "0ed6da7bfe2db038137f2a650ca17903fcd52f542e4769d37327c21e4beec86a"
binding_sha256 = "6f7d11d4bfebdf98e8a3f9c0dd00ec9a3a344b4ea9c85baa435e2df301dbcff7"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
required = ["project"]
additionalProperties = false

[tools.input_schema.properties.project]
type = "string"

[[tools]]
name = "docs-team-a__read_document"
server = "docs-team-a"
upstream_name = "read_document"
classification = "read"
description = "Read one document of one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "88523168357c2c86447effa74bcc7b2224d52b9eef69fc4b4f314e169bf2e28a"
binding_sha256 = "6f7d11d4bfebdf98e8a3f9c0dd00ec9a3a344b4ea9c85baa435e2df301dbcff7"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
required = ["project", "document"]
additionalProperties = false

[tools.input_schema.properties.project]
type = "string"

[tools.input_schema.properties.document]
type = "string"

[[tools]]
name = "docs-team-b__list_documents"
server = "docs-team-b"
upstream_name = "list_documents"
classification = "read"
description = "List the names of the documents in one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "0ed6da7bfe2db038137f2a650ca17903fcd52f542e4769d37327c21e4beec86a"
binding_sha256 = "c0951747c4123b27376876e2a79e99c253b7a3ed0ea4dbe4a5d2a98b8bc61dac"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
required = ["project"]
additionalProperties = false

[tools.input_schema.properties.project]
type = "string"

[[tools]]
name = "docs-team-b__read_document"
server = "docs-team-b"
upstream_name = "read_document"
classification = "read"
description = "Read one document of one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "88523168357c2c86447effa74bcc7b2224d52b9eef69fc4b4f314e169bf2e28a"
binding_sha256 = "c0951747c4123b27376876e2a79e99c253b7a3ed0ea4dbe4a5d2a98b8bc61dac"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
