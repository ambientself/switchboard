# The team manifest for the Compose dev issuer: subject to team. `workload:team-a:stranger` and
# `workload:team-b:stranger` are deliberately absent; the dev issuer signs tokens for them, and
# the gateway refuses them.

[subjects]
"workload:team-a:mock-workload" = "team-a"
"workload:team-b:mock-workload" = "team-b"
# The registry's own workload identity, which the gateway's reach check calls as (decision
# 0011, section 4). Its team's one surface is registry-reach, which admits this subject alone.
"workload:registry:reach-check" = "registry"
