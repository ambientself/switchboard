# The gateway's deployment file for the Compose demo: `switchboard --config=<this file>`.
# The format is in crates/gateway/src/deployment.rs. Relative paths are read from this file's
# directory. Keep it in step with deploy/kind/base/config/gateway.toml; only the issuer, its
# keys, the team manifest, the hosts, the credentials' paths and the metrics address differ.

deployment = "compose-demo"
listen = "0.0.0.0:8080"

[http]
# Host is matched without the port. `gateway` is the Compose service name; the other two are
# how the host reaches the published port.
allowed_hosts = ["gateway", "127.0.0.1", "localhost"]
allowed_origins = []

[registry]
# Inside a mounted directory, not a mounted file, so replacing the file is seen (planDemo 14e).
file = "/etc/switchboard/registry/registry.toml"
poll_seconds = 2

[identity]
mode = "enforce"

# The Compose dev issuer. Development only: it signs tokens for the subjects it is started with,
# and it is reachable only on the Compose network.
[[identity.issuers]]
issuer = "https://dev-issuer.switchboard.test"
kind = "workload"
audiences = ["switchboard"]
algorithm = "RS256"
# Written by the dev issuer at start-up to the shared volume. Read once, at boot.
keys_file = "/shared/issuer/jwks.json"
subjects_file = "teams.toml"
max_lifetime_seconds = 3600
leeway_seconds = 30

[audit]
mode = "postgres"
# The URL, which holds the dummy password, is read from this environment variable.
url_env = "SWITCHBOARD_DATABASE_URL"

[metrics]
# GET /metrics, in Prometheus text. Loopback inside the container: compose.yaml does not publish
# it, and no other container can reach it. demo.sh reads it with `docker compose exec gateway
# curl`. Never the MCP port.
listen = "127.0.0.1:9090"

[drift]
# How often the gateway reads each entry's tool list from mock-docs and withdraws a tool whose
# definition no longer matches its approval. 10 s so a demo sees it; decision 0013 sets 300 s,
# the default, for real deployments. 5 to 900.
interval_seconds = 10
# The reach check (decision 0011, section 4): with each poll, the gateway sends each entry's
# reach_check, a call naming a project outside the entry's reach, to its own listener's
# registry-reach surface, as the registry's workload, workload:registry:reach-check. The
# reach-token service writes that subject's dev-issuer token for audience switchboard to the
# shared file; the gateway reads it on every check. mock-docs must refuse the call.
reach_token_file = "/shared/reach/registry"
reach_url = "http://127.0.0.1:8080/mcp/registry-reach"
reach_host = "gateway"

[drift.probe_credentials]
# What each poll's probe presents on its third call (decision 0013, section 9). Compose has no
# issuer for mock-docs, so it is a static dummy, a Compose secret mock-docs is not given, which
# it must refuse as it would a stranger's token.
docs-team-a = "/run/secrets/registry-probe-credential"
docs-team-b = "/run/secrets/registry-probe-credential"

[credentials]
# A Compose secret for each entry, each holding a dummy value. The proxy sends the entry's own
# upstream; the workload never sees either. mock-docs limits each to its team's project.
docs-team-a-credential = "/run/secrets/docs-team-a-credential"
docs-team-b-credential = "/run/secrets/docs-team-b-credential"
