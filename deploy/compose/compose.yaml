# The Compose demo: Postgres, the migration, the dev issuer, the reach check's token writer,
# the mock docs server and the gateway. `deploy/demo/demo.sh compose` drives it; the `workload` service runs only under the
# `demo` profile. Compose proves the mechanics and makes no claim about network routes
# (draft 0010): every service here shares one network.
#
# Only the gateway is published, on 127.0.0.1:18080. Postgres is not published at all, and
# neither is the dev issuer, which signs for anyone who can reach it.
# Every password and credential below is a dummy value for this demo.
#
# The commands are the image's binaries: `switchboard` (crates/gateway), `switchboard-dev issuer`
# (crates/gateway-dev) and `mock-docs-server` (crates/mock-docs-server).

name: switchboard-demo

x-demo-image: &demo-image
  image: switchboard-demo:dev
  # Built once, by the gateway service below.
  pull_policy: never

x-database: &database
  PGHOST: postgres
  PGPORT: "5432"

services:
  postgres:
    # Pinned by the digest of the tag's multi-arch index. deploy/demo/demo.sh loads the same
    # image into kind as POSTGRES_IMAGE, and crates/demo-checks/tests/pins.rs holds every Postgres
    # pin to one release and digest. A Dependabot pull request that changes this line fails that
    # test until the other pins, which deploy/Dockerfile lists, are changed to match on its branch.
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: dummy-superuser-password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    <<: *demo-image
    command: ["migrate.sh"]
    environment:
      <<: *database
      POSTGRES_PASSWORD: dummy-superuser-password
      OWNER_PASSWORD: dummy-owner-password
      GATEWAY_PASSWORD: dummy-gateway-password
      READER_PASSWORD: dummy-reader-password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  dev-issuer:
    <<: *demo-image
    # Development only. It makes a key pair at start, writes the public half to the shared
    # volume, and answers GET /token?subject=...&audience=... on the Compose network for the
    # subjects below; it is not published. The two strangers are signed so the demo can show
    # the gateway refusing a real token whose subject is not in the team manifest.
    # workload:registry:reach-check is the registry's own workload identity, which the gateway's
    # reach check calls the gateway as (decision 0011, section 4).
    command:
      - switchboard-dev
      - issuer
      - --listen=0.0.0.0:8090
      - --issuer=https://dev-issuer.switchboard.test
      - --keys-out=/shared/issuer/jwks.json
      - --subject=workload:team-a:mock-workload
      - --subject=workload:team-b:mock-workload
      - --subject=workload:team-a:stranger
      - --subject=workload:team-b:stranger
      - --subject=workload:registry:reach-check
    volumes:
      - issuer-keys:/shared/issuer
    healthcheck:
      test: ["CMD-SHELL", "test -s /shared/issuer/jwks.json && curl -fso /dev/null http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  reach-token:
    <<: *demo-image
    # The reach check's token writer: it asks the dev issuer for the registry's workload token,
    # for audience switchboard, and writes it to the shared volume the gateway reads it from,
    # every 60 s, each time to a new file renamed into place. Tokens last 600 s. It never prints
    # the token. The gateway reads the file on every reach check, so it holds no copy of its own.
    command:
      - sh
      - -c
      - |
        umask 077
        while :; do
          if curl -fsS -m 10 -o /shared/reach/.registry.next \
              'http://dev-issuer:8090/token?subject=workload:registry:reach-check&audience=switchboard' &&
            test -s /shared/reach/.registry.next; then
            mv -f /shared/reach/.registry.next /shared/reach/registry
            echo "reach-token: wrote the registry's token for audience switchboard"
            sleep 60
          else
            rm -f /shared/reach/.registry.next
            echo "reach-token: could not get the registry's token; trying again in 2 s"
            sleep 2
          fi
        done
    volumes:
      - reach-token:/shared/reach
    depends_on:
      dev-issuer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-s", "/shared/reach/registry"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-docs:
    <<: *demo-image
    # Accepts only the gateway's two credentials, one for each entry of it in the registry, and
    # limits each to its team's project: docs-team-a's to atlas, docs-team-b's to borealis
    # (dummy-credentials/mock-docs-callers). It is given each credential's sha256, never the
    # credential. It logs the sha256 prefix of every bearer it receives.
    #
    # Its admin endpoint, which changes what it serves, is for demo.sh's drift step alone: it
    # listens on this container's loopback, which no other container can reach, and demo.sh
    # reaches it with `docker compose exec mock-docs curl`. With no admin credential it answers
    # mock-docs' callers, and the binary serves it nowhere but on loopback.
    command: ["mock-docs-server"]
    environment:
      MOCK_DOCS_LISTEN: 0.0.0.0:8080
      MOCK_DOCS_ADMIN_LISTEN: 127.0.0.1:9091
      MOCK_DOCS_TOKEN_SHA256_FILE: /run/secrets/mock-docs-callers
    secrets:
      - mock-docs-callers
    healthcheck:
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:8080/mcp"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    <<: *demo-image
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        REQUIRE_ALL_BINS: "true"
    # The deployment file names everything else: the registry, the dev issuer's keys, the team
    # manifest, the audit database's URL variable and each entry's credential file.
    command: ["switchboard", "--config=/etc/switchboard/gateway.toml"]
    # Decision 0009, Shutdown: on `docker compose stop` or `down`, the gateway serves on for its
    # 8 s readiness removal, though nothing probes it here, and then needs the 2 s begin budget,
    # the 5 s call deadline, the 30 s finish deadline and a 2 s answer budget for the last
    # attempt to complete a failed begin's row: 47 s before it is killed. Otherwise
    # it can be killed while it is still completing rows, and they stay open. Compose's default
    # of 10 s is too short; 50 s is the kind manifest's value. crates/demo-checks holds this to
    # the code's values.
    stop_grace_period: 50s
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SWITCHBOARD_DATABASE_URL: postgres://switchboard_gateway:dummy-gateway-password@postgres:5432/switchboard
      RUST_LOG: info
    volumes:
      - ./config/gateway.toml:/etc/switchboard/gateway.toml:ro
      - ./config/teams.toml:/etc/switchboard/teams.toml:ro
      # demo.sh mounts a copy under .demo/, so withdrawing a tool never edits the repository.
      - ${SWITCHBOARD_REGISTRY_DIR:-./config/registry}:/etc/switchboard/registry:ro
      - issuer-keys:/shared/issuer:ro
      # The registry's workload token, which the reach-token service writes.
      - reach-token:/shared/reach:ro
    secrets:
      - docs-team-a-credential
      - docs-team-b-credential
      - registry-probe-credential
    depends_on:
      migrate:
        condition: service_completed_successfully
      dev-issuer:
        condition: service_healthy
      reach-token:
        condition: service_healthy
      mock-docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:8080/mcp/docs-team-a"]
      interval: 2s
      timeout: 2s
      retries: 30

  workload:
    <<: *demo-image
    profiles: [demo]
    command: ["workload.sh", "full"]
    # Team A by default, on its own surface; demo.sh sets these per run.
    environment:
      GATEWAY_URL: http://gateway:8080/mcp/docs-team-a
      TOKEN_URL: http://dev-issuer:8090/token?subject=workload:team-a:mock-workload&audience=switchboard
      OWN_PROJECT: atlas
      OTHER_PROJECT: borealis
      # Real tokens from the dev issuer that the gateway must refuse: a subject not in the team
      # manifest, and the right subject for another audience.
      BAD_TOKEN_URLS: >-
        http://dev-issuer:8090/token?subject=workload:team-a:stranger&audience=switchboard
        http://dev-issuer:8090/token?subject=workload:team-a:mock-workload&audience=not-switchboard
    depends_on:
      gateway:
        condition: service_healthy

secrets:
  docs-team-a-credential:
    file: ./dummy-credentials/docs-team-a-credential
  docs-team-b-credential:
    file: ./dummy-credentials/docs-team-b-credential
  # The probe's third call presents it: a stranger's dummy, which mock-docs does not accept.
  registry-probe-credential:
    file: ./dummy-credentials/registry-probe-credential
  # Each credential's sha256 and its team's project, one line each.
  mock-docs-callers:
    file: ./dummy-credentials/mock-docs-callers

volumes:
  pgdata:
  issuer-keys:
  reach-token:
