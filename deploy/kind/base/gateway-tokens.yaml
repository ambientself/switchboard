# What the gateway pod's token writer (gateway.yaml, deploy/demo/token-writer.sh) may do in the
# cluster API: create tokens for ServiceAccounts docs-team-a, docs-team-b, registry-probe and
# registry, named, and nothing else (decision 0013, sections 9 and 10). Not for its own
# ServiceAccount, nor any workload's, nor any other in the namespace. crates/demo-checks holds
# resourceNames to exactly these four.
#
# Both of the pod's containers run as ServiceAccount gateway, so the grant belongs to the pod.
# Only the token writer mounts a token the API server accepts; the gateway container mounts
# none, so it cannot use the grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-tokens
  namespace: switchboard
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["docs-team-a", "docs-team-b", "registry-probe", "registry"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-tokens
  namespace: switchboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-tokens
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: switchboard
