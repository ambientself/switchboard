# Postgres for the audit rows. Demo only: the data lives in an emptyDir and is lost with the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: switchboard
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          # The tag only. demo.sh pulls this tag by the digest it pins (POSTGRES_IMAGE, the same
          # as Compose's) and loads it into the cluster under this tag. kind's image load keeps
          # this platform's manifest, not the tag's multi-arch index, so a pod naming the index
          # digest does not find the loaded image and pulls from Docker Hub instead.
          # crates/demo-checks/tests/driver.rs holds this tag to demo.sh's. Dependabot does not
          # read this file; bump it by hand with demo.sh and Compose.
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: superuser-password
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: switchboard
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
