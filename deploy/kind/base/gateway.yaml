# The gateway. It verifies projected ServiceAccount tokens against the cluster's own issuer
# keys, which it fetches from the API server's /openid/v1/jwks with no token, trusting only the
# cluster CA in ConfigMap kube-root-ca.crt (decision 0013, section 10; issuer-discovery.yaml
# lets an unauthenticated caller read them). It writes audit rows to Postgres as
# switchboard_gateway, and forwards allowed calls to mock-docs with the token of the entry the
# tool belongs to: ServiceAccount docs-team-a's on team-a's calls and docs-team-b's on team-b's,
# each for audience mock-docs (decisions 0010 and 0013, section 10). There is no static
# credential. Its deployment file (ConfigMap gateway-config) names everything else it reads.
#
# The token writer, a sidecar, asks the API server for each entry's token and writes it to a
# file the gateway container reads again on every call. Only the token writer mounts a token
# the API server accepts. The gateway container does not, so it cannot use the pod's grant to
# create tokens (gateway-tokens.yaml). crates/demo-checks holds both containers to that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: switchboard
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway
      # Decision 0009, Shutdown: on SIGTERM the gateway fails /readyz and goes on serving for its
      # 8 s readiness removal, which covers the probe below (3 failures, 2 s apart). Only then
      # does it stop taking connections. The grace period must outlast that plus the 2 s begin
      # budget, the 5 s call deadline, the 30 s finish deadline and a 2 s answer budget for the
      # last attempt to complete a failed begin's row, 47 s. Otherwise a stop can
      # kill the gateway while it is still completing rows, and they stay open. Kubernetes'
      # default of 30 s is too short; 50 s leaves a margin. crates/demo-checks holds this to
      # the code's values.
      terminationGracePeriodSeconds: 50
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The gateway refuses to start until the audit table exists; wait for the migration so it
        # does not crash-loop meanwhile. Bounded: it fails after three minutes.
        - name: wait-for-audit-schema
          image: switchboard-demo:dev
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              i=0
              until psql "$SWITCHBOARD_DATABASE_URL" -Atqc 'select 1 from switchboard_audit.call_rows limit 0' >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge 90 ]; then echo "the audit schema did not appear within 180s" >&2; exit 1; fi
                sleep 2
              done
          env:
            - name: SWITCHBOARD_DATABASE_URL
              valueFrom: {secretKeyRef: {name: database, key: gateway-url}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
        # The token writer (deploy/demo/token-writer.sh), a native sidecar: it starts before the
        # gateway and runs beside it. It writes each entry's token, and the probe's, for audience
        # mock-docs and valid for 600 s, to /var/run/switchboard/tokens/<ServiceAccount>, and
        # writes it again every 300 s, each time to a new file renamed into place. The probe's is
        # ServiceAccount registry-probe's: a valid token for mock-docs whose subject mock-docs
        # does not accept, which the drift pass's probe presents on its third call (decision
        # 0013, section 9). ServiceAccount registry's is for audience switchboard, the gateway's
        # own: the reach check presents it to the gateway's listener (decision 0011, section 4).
        # The gateway starts only once all four files exist (the startup probe), since it reads
        # every credential file at boot. A token it cannot get leaves the previous file in place
        # and is tried again in 5 s.
        - name: token-writer
          image: switchboard-demo:dev
          imagePullPolicy: Never
          restartPolicy: Always
          command: ["token-writer.sh"]
          env:
            - {name: TOKEN_SERVICE_ACCOUNTS, value: "docs-team-a docs-team-b registry-probe registry:switchboard"}
            - {name: TOKEN_NAMESPACE, value: switchboard}
            - {name: TOKEN_AUDIENCE, value: mock-docs}
            - {name: TOKEN_EXPIRATION_SECONDS, value: "600"}
            - {name: TOKEN_REFRESH_SECONDS, value: "300"}
            - {name: TOKEN_RETRY_SECONDS, value: "5"}
            - {name: TOKEN_DIR, value: /var/run/switchboard/tokens}
            - {name: API_SERVER, value: "https://kubernetes.default.svc"}
            - {name: API_TOKEN_FILE, value: /var/run/secrets/switchboard/api/token}
            - {name: API_CA_FILE, value: /var/run/secrets/switchboard/api/ca.crt}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test -s /var/run/switchboard/tokens/docs-team-a && test -s /var/run/switchboard/tokens/docs-team-b && test -s /var/run/switchboard/tokens/registry-probe && test -s /var/run/switchboard/tokens/registry
            periodSeconds: 1
            failureThreshold: 120
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: api-token, mountPath: /var/run/secrets/switchboard/api, readOnly: true}
            - {name: entry-tokens, mountPath: /var/run/switchboard/tokens}
      containers:
        - name: gateway
          image: switchboard-demo:dev
          imagePullPolicy: Never
          command: ["switchboard", "--config=/etc/switchboard/config/gateway.toml"]
          env:
            - name: SWITCHBOARD_DATABASE_URL
              valueFrom: {secretKeyRef: {name: database, key: gateway-url}}
            - name: RUST_LOG
              value: info
          ports:
            - containerPort: 8080
              name: http
            # GET /metrics, its own listener ([metrics] in gateway.toml). Not on the Service,
            # and the network policy admits the teams on 8080 only.
            - containerPort: 9090
              name: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/switchboard/config, readOnly: true}
            # No subPath, so ConfigMap edits reach the running gateway.
            - {name: registry, mountPath: /etc/switchboard/registry, readOnly: true}
            # The cluster CA, which kube-root-ca.crt holds in every namespace: the only CA the
            # gateway trusts for the API server's keys URL (keys_ca_file in gateway.toml).
            - {name: cluster-ca, mountPath: /etc/switchboard/cluster-ca, readOnly: true}
            # Each entry's token, the probe's and the registry's, which the token writer writes.
            # Read-only here.
            - {name: entry-tokens, mountPath: /var/run/switchboard/tokens, readOnly: true}
      volumes:
        - name: config
          configMap: {name: gateway-config}
        - name: registry
          configMap: {name: registry}
        # The cluster CA alone, with no token beside it. Every projected token authenticates as
        # the pod's ServiceAccount, so the gateway reads the keys with none (decision 0013,
        # section 10).
        - name: cluster-ca
          configMap: {name: kube-root-ca.crt}
        # The token writer's own token for the API server: no audience, so the API server's,
        # and 600 s, the kubelet's minimum, so it is replaced about every 8 minutes. With it, the
        # cluster's CA. automountServiceAccountToken stays false, so no container gets the
        # default API token; only the token writer mounts this volume.
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
        # The entries' tokens, the probe's and the registry's: the token writer writes them, the
        # gateway reads them. In memory.
        - name: entry-tokens
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: switchboard
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
