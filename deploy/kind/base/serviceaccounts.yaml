# No ServiceAccount here is bound to any Role: the demo's operator checks show that each
# workload can do nothing in the cluster API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: switchboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: switchboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-docs
  namespace: mock-docs
automountServiceAccountToken: false
---
# The two workloads in the team manifest. Their default API token stays mounted: the workload
# presents it to the gateway as a real, cluster-signed token for the wrong audience.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-workload
  namespace: team-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-workload
  namespace: team-b
---
# In team-a's namespace but not in the team manifest: its tokens are refused.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stranger
  namespace: team-a
automountServiceAccountToken: false
