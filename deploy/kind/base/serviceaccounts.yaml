# Only ServiceAccount gateway is bound to a Role: gateway-tokens.yaml lets it ask for tokens of
# docs-team-a, docs-team-b, registry-probe and registry, by name, and nothing else. No other ServiceAccount
# here is bound to any Role: the demo's operator checks show that each workload can do nothing in
# the cluster API. No ServiceAccount here mounts its API token automatically.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: switchboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: switchboard
automountServiceAccountToken: false
---
# The identities of the mock server's two entries in the registry (decision 0013, section 10):
# the gateway presents docs-team-a's token on team-a's calls and docs-team-b's on team-b's, and
# mock-docs limits each to its team's project. No pod runs as either. The gateway pod's token
# writer asks for their tokens (gateway.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docs-team-a
  namespace: switchboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docs-team-b
  namespace: switchboard
automountServiceAccountToken: false
---
# The probe's identity (decisions 0010 and 0013, section 9): a subject outside the gateway's
# identities, whose token for audience mock-docs the drift pass's probe presents on its third
# call. mock-docs accepts only docs-team-a and docs-team-b, so it must refuse it. No pod runs as
# it; the gateway pod's token writer asks for its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-probe
  namespace: switchboard
automountServiceAccountToken: false
---
# The registry's own workload identity (decision 0011, section 4): the gateway's reach check
# calls the gateway's own listener as this account, for audience switchboard, so each check is
# decided and audited like any call. The team manifest maps it to team registry, and the
# registry's registry-reach surface admits it alone. No pod runs as it; the gateway pod's token
# writer asks for its token, and it is bound to no Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry
  namespace: switchboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-docs
  namespace: mock-docs
automountServiceAccountToken: false
---
# The two workloads in the team manifest. No workload mounts an API token (decision 0013,
# section 10): the token a workload presents to the gateway for the wrong audience is a
# projected one (workloads.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-workload
  namespace: team-a
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-workload
  namespace: team-b
automountServiceAccountToken: false
---
# In team-a's namespace but not in the team manifest: its tokens are refused.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stranger
  namespace: team-a
automountServiceAccountToken: false
