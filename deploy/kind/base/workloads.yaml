# A ServiceAccount the team manifest does not list. Its real, correctly scoped token is refused.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stranger-workload
  namespace: team-a
  labels:
    app: stranger-workload
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  jobTemplate:
    metadata:
      labels:
        app: stranger-workload
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: stranger-workload
        spec:
          serviceAccountName: stranger
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: workload
              image: switchboard-demo:dev
              imagePullPolicy: Never
              command: ["workload.sh"]
              args: ["refused"]
              env:
                - {name: GATEWAY_URL, value: "http://gateway.switchboard.svc.cluster.local:8080/mcp/docs"}
                - {name: TOKEN_FILE, value: /var/run/secrets/switchboard/token}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: switchboard-token, mountPath: /var/run/secrets/switchboard, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: switchboard-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: switchboard
                      expirationSeconds: 600
                      path: token
            - {name: tmp, emptyDir: {}}
