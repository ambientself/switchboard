# The demo registry for kind (planDemo 14b): the mock server registered once per team, two read
# tools on each entry, and one surface per team. The loader is gateway-registry;
# crates/gateway-registry/demo/registry.toml documents the format. The issuer is the cluster's
# own ServiceAccount issuer and the address is the mock server's in-cluster Service.
#
# Keep it in step with deploy/compose/config/registry/registry.toml, which differs only in the
# issuer under [[profile_rules]], the identity and address under [[servers]], and so each
# tool's binding_sha256; crates/demo-checks checks that. Every value here is a dummy. Each
# credential reference is a label: the deployment file's [credentials] table maps it to the
# file holding that entry's credential.

# Recorded with every decision made from this file. Change it with every edit.
revision = "demo-3"

# --- Servers -------------------------------------------------------------------------------
# A proxied MCP server, registered by its owner. `system` is the first part of every exposed
# name of its tools: docs-team-a__list_documents, docs-team-a__read_document. `identity` is the
# DNS name the connection proves, and must be the host in `address`.
#
# The mock server is registered once per team (decisions 0010 and 0013, section 10). Both
# entries have the same address and identity. Each presents its own credential, and the mock
# server limits each credential to its team's project: docs-team-a's to atlas, docs-team-b's to
# borealis. So a call through one team's entry cannot reach the other team's project, even if
# the gateway's own resource check were wrong.

[[servers]]
name = "docs-team-a"
system = "docs-team-a"
owner = "platform"
identity = "mock-docs.mock-docs.svc.cluster.local"
address = "http://mock-docs.mock-docs.svc.cluster.local:8080/mcp"
credential = { mode = "bearer", reference = "docs-team-a-credential" }

[[servers]]
name = "docs-team-b"
system = "docs-team-b"
owner = "platform"
identity = "mock-docs.mock-docs.svc.cluster.local"
address = "http://mock-docs.mock-docs.svc.cluster.local:8080/mcp"
credential = { mode = "bearer", reference = "docs-team-b-credential" }

# --- Tools ---------------------------------------------------------------------------------
# Each tool is approved by a person, who assigns its classification and records two hashes.
# `definition_sha256` covers the tool's upstream name, title, description and input schema,
# written here exactly as the server serves them: the mock server's `tools/list`, which has no
# title (see `gateway_registry::definition_sha256`). `binding_sha256` covers its server's
# identity, address and credential, and the schema dialect (see
# `gateway_registry::binding_sha256`). The loader recomputes both and refuses a file in which
# either differs from what was approved, so a changed server entry needs its tools approved
# again.
#
# `resources` is either "no_resources" or { from_arguments = [...] }: each entry names a string
# argument whose value is the identifier of a resource of that system and kind. There is no
# default: a tool must say which.

[[tools]]
name = "docs-team-a__list_documents"
server = "docs-team-a"
upstream_name = "list_documents"
classification = "read"
description = "List the names of the documents in one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "0ed6da7bfe2db038137f2a650ca17903fcd52f542e4769d37327c21e4beec86a"
binding_sha256 = "9870f4a12f8ab50bc9343705665a33edeb0d7a3506e0c0e815a8f77a198cfaf5"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
required = ["project"]
additionalProperties = false

[tools.input_schema.properties.project]
type = "string"

[[tools]]
name = "docs-team-a__read_document"
server = "docs-team-a"
upstream_name = "read_document"
classification = "read"
description = "Read one document of one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "88523168357c2c86447effa74bcc7b2224d52b9eef69fc4b4f314e169bf2e28a"
binding_sha256 = "9870f4a12f8ab50bc9343705665a33edeb0d7a3506e0c0e815a8f77a198cfaf5"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
required = ["project", "document"]
additionalProperties = false

[tools.input_schema.properties.project]
type = "string"

[tools.input_schema.properties.document]
type = "string"

[[tools]]
name = "docs-team-b__list_documents"
server = "docs-team-b"
upstream_name = "list_documents"
classification = "read"
description = "List the names of the documents in one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "0ed6da7bfe2db038137f2a650ca17903fcd52f542e4769d37327c21e4beec86a"
binding_sha256 = "808578ebf84de4b06707a7a2b4ab30b904bdc5e3a210e5f9361d9f76d04d7b29"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
required = ["project"]
additionalProperties = false

[tools.input_schema.properties.project]
type = "string"

[[tools]]
name = "docs-team-b__read_document"
server = "docs-team-b"
upstream_name = "read_document"
classification = "read"
description = "Read one document of one project."
approved_by = "demo-approver@example.test"
approved_at = 2026-10-11T00:00:00Z
definition_sha256 = "88523168357c2c86447effa74bcc7b2224d52b9eef69fc4b4f314e169bf2e28a"
binding_sha256 = "808578ebf84de4b06707a7a2b4ab30b904bdc5e3a210e5f9361d9f76d04d7b29"
resources = { from_arguments = [{ from_argument = "project", system = "docs", kind = "project" }] }

[tools.input_schema]
type = "object"
required = ["project", "document"]
additionalProperties = false

[tools.input_schema.properties.project]
type = "string"

[tools.input_schema.properties.document]
type = "string"

# --- Surfaces ------------------------------------------------------------------------------
# Served at /mcp/{name}. Who may use it is an allowlist of teams and groups. Each team has its
# own surface, serving only its own entry's tools.

[[surfaces]]
name = "docs-team-a"
tools = ["docs-team-a__list_documents", "docs-team-a__read_document"]
teams = ["team-a"]
principals = "any_in_teams_and_groups"

[[surfaces]]
name = "docs-team-b"
tools = ["docs-team-b__list_documents", "docs-team-b__read_document"]
teams = ["team-b"]
principals = "any_in_teams_and_groups"

# --- Profiles and how they are selected ----------------------------------------------------
# A rule matches the issuer exactly, and either every workload it vouches for
# (principal = "workload") or every user in a group (principal = { user_in_group = "..." }).
# When rules covering one principal disagree, no profile is selected and the call is refused.

[[profiles]]
name = "workload-read"
classifications = ["read"]
requires_delegation = false

[[profile_rules]]
issuer = "https://kubernetes.default.svc.cluster.local"
principal = "workload"
profile = "workload-read"

# --- Resource limits -----------------------------------------------------------------------
# Exact matches on system, kind and identifier. Each team reads its own project only.

[limits.teams]
team-a = [{ system = "docs", kind = "project", identifier = "atlas" }]
team-b = [{ system = "docs", kind = "project", identifier = "borealis" }]
