# The gateway's deployment file for the kind demo: `switchboard --config=<this file>`. The format
# is in crates/gateway/src/deployment.rs. Relative paths are read from this file's directory.
# Keep it in step with deploy/compose/config/gateway.toml; only the issuer, its keys, the team
# manifest, the hosts and the credential's path differ.

deployment = "kind-demo"
listen = "0.0.0.0:8080"

[http]
allowed_hosts = ["gateway.switchboard.svc.cluster.local", "gateway.switchboard.svc"]
allowed_origins = []

[registry]
# ConfigMap `registry`, mounted without subPath, so an edit reaches the running gateway.
file = "/etc/switchboard/registry/registry.toml"
poll_seconds = 2

[identity]
mode = "enforce"

# The cluster's own ServiceAccount issuer. demo.sh checks that the cluster reports exactly this
# issuer and copies its keys into ConfigMap cluster-issuer-keys at deploy time. The keys are
# copied once: they are not fetched, and not rotated.
[[identity.issuers]]
issuer = "https://kubernetes.default.svc.cluster.local"
kind = "workload"
audiences = ["switchboard"]
algorithm = "RS256"
keys_file = "/etc/switchboard/issuer/jwks.json"
subjects_file = "teams.toml"
max_lifetime_seconds = 3600
leeway_seconds = 30

[audit]
mode = "postgres"
url_env = "SWITCHBOARD_DATABASE_URL"

[credentials]
# The gateway's own projected ServiceAccount token, for audience mock-docs (gateway.yaml). The
# kubelet rotates it in place; the proxy reads it again on every call and sends it upstream. The
# workload never sees it. The reference keeps its name, so the registry is the same as Compose's.
docs-credential = "/var/run/secrets/switchboard/mock-docs/token"
