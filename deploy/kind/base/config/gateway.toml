# The gateway's deployment file for the kind demo: `switchboard --config=<this file>`. The format
# is in crates/gateway/src/deployment.rs. Relative paths are read from this file's directory.
# Keep it in step with deploy/compose/config/gateway.toml; only the issuer, where its keys come
# from, the team manifest, the hosts, the credentials' paths and the metrics address differ.

deployment = "kind-demo"
listen = "0.0.0.0:8080"

[http]
allowed_hosts = ["gateway.switchboard.svc.cluster.local", "gateway.switchboard.svc"]
allowed_origins = []

[registry]
# ConfigMap `registry`, mounted without subPath, so an edit reaches the running gateway.
file = "/etc/switchboard/registry/registry.toml"
poll_seconds = 2

[identity]
mode = "enforce"

# The cluster's own ServiceAccount issuer. demo.sh checks that the cluster reports exactly this
# issuer. The gateway fetches its keys from the API server, on the issuer's own origin, at boot
# and on a timer. It sends no token: the kind base binds system:service-account-issuer-discovery
# to system:unauthenticated (issuer-discovery.yaml; decision 0013, section 10). It trusts only
# the cluster CA, from ConfigMap kube-root-ca.crt (gateway.yaml).
[[identity.issuers]]
issuer = "https://kubernetes.default.svc.cluster.local"
kind = "workload"
audiences = ["switchboard"]
algorithm = "RS256"
keys_url = "https://kubernetes.default.svc.cluster.local/openid/v1/jwks"
keys_ca_file = "/etc/switchboard/cluster-ca/ca.crt"
# The cluster's keys do not change during a demo run, so this sets only how often the gateway
# asks again: one small request a minute to the API server. While refreshes succeed, the key age
# metric stays near a minute. A failed refresh keeps the keys in use, so the age can grow past
# that (decision 0013). The least the gateway accepts is 30.
keys_refresh_seconds = 60
subjects_file = "teams.toml"
max_lifetime_seconds = 3600
leeway_seconds = 30

[audit]
mode = "postgres"
url_env = "SWITCHBOARD_DATABASE_URL"

[metrics]
# GET /metrics, in Prometheus text, on the pod's containerPort `metrics` (gateway.yaml), for a
# scraper in the cluster. The Service does not expose it, and the network policy admits the
# teams on 8080 only. demo.sh reads it with `kubectl exec ... curl`. Never the MCP port.
listen = "0.0.0.0:9090"

[credentials]
# Each entry's token: ServiceAccount docs-team-a's and docs-team-b's, for audience mock-docs,
# which the gateway pod's token writer writes and replaces every 300 s (gateway.yaml). The proxy
# reads the file again on every call and sends it upstream. The workload never sees it. The
# references are the registry's, the same as Compose's.
docs-team-a-credential = "/var/run/switchboard/tokens/docs-team-a"
docs-team-b-credential = "/var/run/switchboard/tokens/docs-team-b"
