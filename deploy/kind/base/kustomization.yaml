# The kind demo, without network policy. demo.sh applies this first, shows that a direct call
# to the mock docs server connects, and only then applies ../policy.
#
# Before applying this, demo.sh creates ConfigMap cluster-issuer-keys, in switchboard and in
# mock-docs, from the cluster's own issuer (kubectl get --raw /openid/v1/jwks). Neither the
# gateway nor mock-docs will start without it.
#
# The gateway has no static credential for mock-docs: it presents a projected token of its own
# ServiceAccount (gateway.yaml). Every password here is a dummy value for this demo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - serviceaccounts.yaml
  - postgres.yaml
  - migrate-job.yaml
  - mock-docs.yaml
  - gateway.yaml
  - workloads.yaml
configMapGenerator:
  - name: gateway-config
    namespace: switchboard
    files:
      - gateway.toml=config/gateway.toml
      - teams.toml=config/teams.toml
  # Not hashed: the gateway mounts this directory without subPath and polls it, so an edit to the
  # ConfigMap reaches the running gateway (kubelet takes roughly a minute) without a restart.
  - name: registry
    namespace: switchboard
    files:
      - registry.toml=config/registry/registry.toml
    options:
      disableNameSuffixHash: true
secretGenerator:
  - name: database
    namespace: switchboard
    literals:
      - superuser-password=dummy-superuser-password
      - owner-password=dummy-owner-password
      - gateway-password=dummy-gateway-password
      - reader-password=dummy-reader-password
      - gateway-url=postgres://switchboard_gateway:dummy-gateway-password@postgres.switchboard.svc.cluster.local:5432/switchboard
