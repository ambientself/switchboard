# The mock docs server (#14a), in its JWT mode (decision 0010). It accepts only a token the
# cluster signed for one of the registry's two entries of it, ServiceAccounts docs-team-a and
# docs-team-b, for audience mock-docs, and in date. Each may name only its team's project:
# docs-team-a atlas, docs-team-b borealis (decision 0013, section 10). It checks the signature
# against the cluster's keys, which demo.sh copies once into ConfigMap
# mock-docs/cluster-issuer-keys, and holds no credential of its own. Each request's log line
# names the verified caller, or why the token was refused.
#
# slow-doc keeps its default delay, 10 s, longer than the gateway's 5 s call deadline: demo.sh's
# hanging-server and overload steps read it. The admin endpoint, which changes what the server
# serves and the projects each caller may name, is for demo.sh's drift and reach steps alone.
# It listens on the pod's loopback, with no containerPort, Service or network policy naming it,
# so no other pod can reach it; demo.sh reaches it with `kubectl exec`. With no admin credential
# it answers mock-docs' callers, and the binary serves it nowhere but on loopback.
# crates/demo-checks holds the manifests to that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-docs
  namespace: mock-docs
  labels:
    app: mock-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-docs
  template:
    metadata:
      labels:
        app: mock-docs
    spec:
      serviceAccountName: mock-docs
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-docs
          image: switchboard-demo:dev
          imagePullPolicy: Never
          command: ["mock-docs-server"]
          env:
            - {name: MOCK_DOCS_LISTEN, value: "0.0.0.0:8080"}
            - {name: MOCK_DOCS_ADMIN_LISTEN, value: "127.0.0.1:9091"}
            - {name: MOCK_DOCS_JWT_ISSUER, value: "https://kubernetes.default.svc.cluster.local"}
            - {name: MOCK_DOCS_JWT_AUDIENCE, value: mock-docs}
            - {name: MOCK_DOCS_JWT_SUBJECTS, value: "system:serviceaccount:switchboard:docs-team-a=atlas;system:serviceaccount:switchboard:docs-team-b=borealis"}
            - {name: MOCK_DOCS_JWKS_FILE, value: /etc/mock-docs/issuer/jwks.json}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: issuer-keys, mountPath: /etc/mock-docs/issuer, readOnly: true}
      volumes:
        - name: issuer-keys
          configMap: {name: cluster-issuer-keys}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-docs
  namespace: mock-docs
spec:
  selector:
    app: mock-docs
  ports:
    - name: http
      port: 8080
      targetPort: http
