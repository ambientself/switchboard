[workspace]
resolver = "3"
members = ["crates/gateway-core"]

[workspace.package]
edition = "2024"
# The version CI tests with, pinned in rust-toolchain.toml. Nothing older is tested.
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
