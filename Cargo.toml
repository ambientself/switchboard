[workspace]
resolver = "3"
members = ["crates/gateway-core"]

[workspace.package]
edition = "2024"
# Edition 2024 needs 1.85; nothing here needs anything newer.
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
