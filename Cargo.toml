[workspace]
resolver = "3"
members = ["crates/gateway-core", "crates/gateway-identity", "crates/gateway-registry", "crates/gateway-testkit"]

[workspace.package]
edition = "2024"
# The version CI tests with, pinned in rust-toolchain.toml. Nothing older is tested.
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Third-party crates are built optimised even in the dev profile. The tests generate RSA keys
# (the local issuer never uses a checked-in key), and in an unoptimised build that costs seconds
# per key; the mutation check runs the whole suite once per mutation, so it adds up. The
# workspace's own crates stay unoptimised, so a failing test still debugs normally.
[profile.dev.package."*"]
opt-level = 2
